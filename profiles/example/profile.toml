[profile]
id = "example"
name = "Example Agent"
description = "Public demo profile: one dummy HTTP JSON tool"

[model]
spec = "openai:gpt-5.6-luna"

[code_tool]
name = "data_code"
purpose = "THE ONLY WAY TO FETCH DATA: the tools listed below exist solely as Python functions inside this sandbox. Fetch here, save big payloads to /work/data/, return a small result. For analyzing already-saved files use python_analysis instead (full CPython)."
wall_clock_s = 60
max_retries = 3

[tools]
modules = ["json_placeholder.py"]

[env]
required = []
[env.defaults]
JSON_API_BASE = "https://jsonplaceholder.typicode.com"

[limits]
spill_tokens = 8000
analysis_timeout_s = 60

[instructions]
data_tool_examples = "get_post, list_posts"
report_detail_hint = "the fetched records"
