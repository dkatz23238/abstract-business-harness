[project]
name = "bizharness"
version = "0.1.0"
description = "Profile-driven long-horizon analysis agent (engine + AG-UI). Domain logic lives in a separate profile directory."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "logfire>=5.0.0",
    # pinned: bizharness/harness_patches.py overrides a private method
    "pydantic-ai-harness[code-mode,skills]==0.30.0",
    "pydantic-ai-slim[ag-ui,anthropic,cli,openai]",
    "requests>=2.31",
    "pandas>=2.2",
    "rich>=15.0.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bizharness = "bizharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bizharness"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
