name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv sync --frozen --extra dev

      - run: uv run pytest -q

      - name: Release tag matches abstract.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "import abstract; print(abstract.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match abstract.__version__ $version" >&2
            exit 1
          fi

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: dkatz23238
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          # Push-only so base-image pulls keep the runner's Docker Hub credentials.
          scope: dkatz23238/abstract-business-harness@push

      # Branch pushes publish main and sha-<commit>. A v1.2.3 tag publishes
      # 1.2.3, 1.2 and latest, so latest only moves on a release.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: dkatz23238/abstract-business-harness
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
